name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Tests and data validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Locate Google Chrome and set CHROME_PATH
        run: |
          chrome_path=$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser)
          echo "Using Chrome path: $chrome_path"
          echo "CHROME_PATH=$chrome_path" >> $GITHUB_ENV

      - name: Validate JSON syntax
        run: |
          python -c "import json, glob; [json.load(open(f, encoding='utf-8')) for f in glob.glob('data/*.json')]"

      - name: Validate data regeneration
        run: |
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          cp -R data "$temp_dir/"

          (
            cd "$temp_dir"
            python "$GITHUB_WORKSPACE/scripts/build_priority_draft.py"
            python "$GITHUB_WORKSPACE/scripts/promote_measurement_priority.py"
            python "$GITHUB_WORKSPACE/scripts/build_protocols_draft.py"
            python "$GITHUB_WORKSPACE/scripts/promote_protocols.py"
          )

          for artifact in \
            data/measurement-priority.draft.json \
            data/measurement-priority.json \
            data/protocols.draft.json \
            data/protocols.json \
            data/protocols.beta.json
          do
            cmp "$artifact" "$temp_dir/$artifact"
          done

      - name: Run tests
        run: |
          PYTHONPATH=. python -m pytest -q

      - name: Check for unstaged changes
        run: |
          git diff --exit-code
